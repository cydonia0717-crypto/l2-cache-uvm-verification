name: oss-smoke
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:

concurrency:
  group: oss-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verilator-uvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap UVM/Vortex
        run: SKIP_APT=1 SKIP_VERILATOR_BUILD=1 bash scripts/bootstrap_oss.sh

      - name: Static project checks
        run: python3 scripts/check_project.py

      - name: Compile + smoke
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 FORCE_REBUILD=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_smoke_test SEED=1 bash scripts/run_verilator.sh

      - name: Same-line pending miss
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_same_line_merge_test SEED=2 bash scripts/run_verilator.sh

      - name: MSHR full pressure
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_mshr_full_test SEED=3 bash scripts/run_verilator.sh

      - name: Out-of-order refill
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_ooo_refill_test SEED=4 bash scripts/run_verilator.sh

      - name: Clean eviction
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_clean_eviction_test SEED=5 bash scripts/run_verilator.sh

      - name: Dirty eviction
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_dirty_eviction_test SEED=6 bash scripts/run_verilator.sh

      - name: Bank hotspot
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_bank_hotspot_test SEED=7 bash scripts/run_verilator.sh

      - name: Random stress
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            TEST=l2_random_test SEED=8 bash scripts/run_verilator.sh

      - name: Extended directed regression
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            bash scripts/extended_regression.sh

      - name: Multi-seed random regression
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 BUILD_OUT="$PWD/out/verilator/ci-build" \
            bash scripts/random_multiseed.sh

      - name: Historical flush-race mutation
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 bash scripts/repro_historical_flush_bug.sh

      - name: Historical MSHR release/coalesce mutation
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 bash scripts/repro_historical_mshr_release_bug.sh

      - name: Merge coverage
        if: always()
        run: bash scripts/merge_coverage.sh

      - name: Generate regression summary
        if: always()
        run: python3 scripts/summarize_regression.py

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-cache-regression-${{ github.run_number }}
          path: |
            out/verilator/runs/**/run.log
            out/verilator/runs/**/coverage.dat
            out/verilator/coverage/merged.dat
            out/verilator/coverage/merged.info
            out/verilator/coverage/summary.txt
            out/verilator/coverage/scope_summary.txt
            out/verilator/coverage/regression_summary.md
            out/mutation/historical-flush-race/**
            out/mutation/historical-mshr-release-race/**
          if-no-files-found: warn
          retention-days: 30
