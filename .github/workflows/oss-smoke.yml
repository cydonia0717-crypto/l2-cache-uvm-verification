name: oss-smoke
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  verilator-uvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap UVM/Vortex
        run: SKIP_VERILATOR_BUILD=1 bash scripts/bootstrap_oss.sh
      - name: Static project checks
        run: python3 scripts/check_project.py
      - name: Smoke
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 TEST=l2_smoke_test SEED=1 bash scripts/run_verilator.sh
      - name: Same-line merge
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 TEST=l2_same_line_merge_test SEED=2 bash scripts/run_verilator.sh
      - name: MSHR pressure
        run: |
          source .env.oss
          VERILATOR_DOCKER=1 TEST=l2_mshr_full_test SEED=3 bash scripts/run_verilator.sh
